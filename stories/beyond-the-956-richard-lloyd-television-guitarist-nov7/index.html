<title>Beyond the 956: Richard Lloyd, co-founder and guitarist of Television, dies at 75 — Webb Watch 956</title>
<meta name="description" content="Richard Lloyd, co-founding guitarist of the legendary New York rock band Television, has died at 75. His family confirmed he died on Saturday, November 7, 2026, at his home in Chattanooga, Tennessee, of cholangiocarcinoma, a form of bile duct cancer. Television&#x27;s 1977 debut, Marquee Moon, is regarded as one of the greatest rock albums ever made.">
