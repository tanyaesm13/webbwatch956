<title>Weather Alert — Beyond the 956: Tropical Storm In-fa Tracked East of Guam; No Threat Expected, Island at Normal Readiness — Webb Watch 956</title>
<meta name="description" content="Tropical Storm In-fa is spinning in the open Pacific about 1,465 miles east of Guam with 40 mph winds — and forecasters say it is no threat to the island. The Joint Typhoon Warning Center&#x27;s track keeps its closest pass more than 1,000 miles away next Thursday, the National Weather Service in Guam has posted no watch or warning, and Guam remains at Condition of Readiness 4, its normal readiness level, as the island finishes recovering from Super Typhoon Champi.">
