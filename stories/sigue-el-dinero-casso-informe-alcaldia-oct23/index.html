<title>Sigue el dinero: Poncho Casso dice &quot;nadie es mi dueño&quot; — su propio informe es la prueba — Webb Watch 956</title>
<meta name="description" content="El candidato a la alcaldía Alfonso &quot;Poncho&quot; Casso hace campaña como el hombre con menos fondos de la contienda, que no le responde a ningún donante. Su informe de finanzas de campaña del día 30 — un documento público presentado ante la Secretaría de la Ciudad — es donde esa afirmación realmente se puede comprobar. Webb Watch 956 fue al informe, y el informe respalda el discurso: $4,000 de exactamente dos donantes, $721.23 gastados y ningún préstamo.">
