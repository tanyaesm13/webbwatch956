<title>Alerta Meteorológica — Más Allá del 956: La tormenta tropical In-fa se vigila al este de Guam; no se espera amenaza y la isla está en nivel normal de preparación — Webb Watch 956</title>
<meta name="description" content="La tormenta tropical In-fa gira en el Pacífico abierto a unas 1,465 millas al este de Guam con vientos de 40 mph — y los pronosticadores dicen que no representa una amenaza para la isla. La trayectoria del Centro Conjunto de Advertencia de Tifones mantiene su paso más cercano a más de 1,000 millas de distancia el próximo jueves, el Servicio Meteorológico Nacional en Guam no ha emitido ninguna vigilancia ni aviso, y Guam permanece en Condición de Preparación 4, su nivel normal, mientras la isla termina de recuperarse del supertifón Champi.">
